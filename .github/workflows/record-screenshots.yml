name: Record Screenshot Baseline

on:
  workflow_dispatch:

jobs:
  roborazzi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Record Roborazzi screenshots baseline
        run: ./gradlew recordRoborazziDebug

