name: Record Screenshot Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roborazzi:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Record Roborazzi screenshots baseline
        run: ./gradlew recordRoborazziDebug
      - name: Commit updated baselines
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update Roborazzi screenshot baselines
          file_pattern: "feature-characters/screenshots/roborazzi/*.png feature-comics/screenshots/roborazzi/*.png library-components/screenshots/roborazzi/*.png"
          disable_globbing: true

